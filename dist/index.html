<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" as="image" href="/assets/textures/gym/banners/StrafeBallLeageTrimmed.png" />
    <!-- Whiteboard-scoreboard marker fonts: Permanent Marker (headers), Bangers (mode/timer),
         Patrick Hand (player names). Gives the HUD a real dry-erase look instead of a Word-doc one. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Bangers&family=Patrick+Hand&display=swap"
    />
    <title>Strafeball Greybox Prototype</title>
    <!--
      Critical loading-screen CSS, inlined so the themed splash paints on the FIRST frame.
      The full stylesheet (src/style.css) is imported from JS and arrives a beat later; without
      this inline copy the browser would flash the raw, unstyled markup first.
    -->
    <style>
      :root {
        --ink: #15213b;
        --paper: #fdf6e3;
        --school-gold: #ffcf2e;
      }
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0c1326;
        font-family: 'Trebuchet MS', 'Segoe UI', Verdana, sans-serif;
      }
      #loading-screen {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(120% 90% at 50% 0%, #1c2c4f 0%, #0c1326 70%);
        opacity: 1;
        transition: opacity 0.45s ease;
      }
      #loading-screen.hidden { opacity: 0; pointer-events: none; }
      .loading-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 26px;
        width: min(560px, calc(100vw - 48px));
        padding: 30px 30px 34px;
      }
      .loading-banner {
        width: 100%;
        height: auto;
        border: 4px solid var(--ink);
        border-radius: 16px;
        box-shadow: 6px 6px 0 var(--ink), 0 0 0 4px var(--school-gold) inset;
        transform: rotate(-1.4deg);
        animation: loading-banner-bob 2.6s ease-in-out infinite;
      }
      @keyframes loading-banner-bob {
        0%, 100% { transform: rotate(-1.4deg) translateY(0); }
        50%      { transform: rotate(-1.4deg) translateY(-6px); }
      }
      .loading-bar-track {
        position: relative;
        width: 100%;
        height: 26px;
        background: var(--paper);
        border: 3px solid var(--ink);
        border-radius: 999px;
        box-shadow: 4px 4px 0 var(--ink);
        overflow: hidden;
      }
      .loading-bar-fill {
        height: 100%;
        width: 0%;
        border-radius: 999px;
        background: repeating-linear-gradient(-45deg, var(--school-gold) 0 14px, #ffe07a 14px 28px);
        background-size: 200% 100%;
        transition: width 0.3s ease;
        animation: loading-bar-stripes 0.9s linear infinite;
      }
      @keyframes loading-bar-stripes {
        from { background-position: 0 0; }
        to   { background-position: 40px 0; }
      }
      .loading-status {
        font-size: 17px;
        font-weight: 800;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        color: var(--paper);
        text-shadow: 2px 2px 0 var(--ink);
      }
    </style>
    <script type="module" crossorigin src="/assets/index-DaNumNAZ.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-zEfcjzTz.css">
  </head>
  <body>
    <div id="loading-screen">
      <div class="loading-card">
        <img class="loading-banner" src="/assets/textures/gym/banners/StrafeBallLeageTrimmed.png" alt="Strafeball Dodgeball League" />
        <div class="loading-bar-track">
          <div class="loading-bar-fill" id="loading-bar-fill"></div>
        </div>
        <div class="loading-status" id="loading-status">Warming up the gym&hellip;</div>
      </div>
    </div>
    <canvas id="gameCanvas"></canvas>
    <div id="hud-root"></div>
    <div id="lock-overlay">
      Click to play
      <span>mouse = look &middot; WASD = move &middot; Esc releases the cursor</span>
    </div>
  </body>
</html>
